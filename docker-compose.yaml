services:
  # Digital Calendar Phase 1 Database
  db:
    image: postgres:15-alpine
    container_name: digital-calendar-db
    environment:
      POSTGRES_USER: digitalcalendar
      POSTGRES_PASSWORD: digitalcalendar
      POSTGRES_DB: digitalcalendar
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitalcalendar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Digital Calendar Phase 1 Backend API
  backend:
    build:
      context: ./backend
    container_name: digital-calendar-backend
    environment:
      DATABASE_URL: postgresql://digitalcalendar:digitalcalendar@db:5432/digitalcalendar
      CORS_ORIGINS: http://localhost:3000,http://localhost,http://100.104.202.19:3000,http://home.lab:3000,http://10.0.0.156:3000
      PORT: "8000"
      ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Digital Calendar Phase 1 Frontend
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://100.104.202.19:8000
        REACT_APP_DEFAULT_VIEW: dashboard
    container_name: digital-calendar-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/public/generated:/app/build/generated
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - homepage
      - backend
      - frontend
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    volumes:
      - /home/shreyasshivalkar/Projects/DigitalCalendar/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.lab,100.104.202.19,mealie.home.lab,localhost:3000,127.0.0.1:3000,10.0.0.156:3000,100.104.202.19:3000
    restart: unless-stopped

  # Jellyfin media server
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - jellyfin_media:/media
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8097:8096" # Host Jellyfin already uses 8096
    restart: unless-stopped

  alexa-dashboard:
    build:
      context: ./services/alexa-dashboard
    container_name: alexa-dashboard
    ports:
      - "8010:8010"
    volumes:
      - ./config/alexa-dashboard:/data
    environment:
      PORT: "8010"
      TZ: America/Los_Angeles
      ALEXA_TIMEZONE: America/Los_Angeles
      ALEXA_DOMAIN: amazon.com
      ALEXA_EMAIL: ""
      ALEXA_PASSWORD: ""
      ALEXA_OTP_SECRET: ""
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  jellyfin_config:
  jellyfin_cache:
  jellyfin_media:
